name: Wiek validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiek-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/sdk/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix packages/sdk ci --ignore-scripts
      - name: Configure and record deterministic desktop size
        run: |
          swift tools/configure-ci-display.swift > reports/ci-display.log 2>&1
          swift tools/configure-ci-display.swift --verify-only > reports/ci-display-verify.log 2>&1
      - name: Verify tracked evaluation inputs
        run: node tools/verify-framework-inputs.mjs > reports/ci-framework-inputs.log 2>&1
      - name: SDK tests and build
        # Original assertions include small wall-clock budgets. Keep all tests
        # and thresholds, but avoid unrelated parallel files stalling timers.
        run: |
          {
            npm --prefix packages/sdk run build
            npm --prefix packages/sdk run check:skill-translation
            npm --prefix packages/sdk run typecheck
            node tools/run-sdk-regression.mjs
          } > reports/ci-sdk.log 2>&1
      - name: Build owned native helpers
        run: npm run build:desktop-native > reports/ci-native-build.log 2>&1
      - name: Repository-owned V2 evaluation framework
        run: |
          {
            python3 -m venv data/benchmark-bootstrap
            data/benchmark-bootstrap/bin/pip install uv==0.11.19
            data/benchmark-bootstrap/bin/uv sync --project benchmark/framework --python 3.13.13 --frozen --group dev
            export PYTHONPATH="$PWD/benchmark/framework"
            benchmark/framework/.venv/bin/python -m pytest -q benchmark/sdk-v2/test_canonical_v2.py benchmark/framework/tests
            benchmark/framework/.venv/bin/python benchmark/sdk-v2/smoke.py benchmark/framework --browser wiek
          } > reports/ci-benchmark-adapter.log 2>&1
      - name: Local services and actual Electron fixture panels
        # Preserve the fixture subprocess deadlines while isolating test files.
        run: node --test --test-concurrency=1 tests/*.test.mjs > reports/ci-source-tests.log 2>&1
      - name: Restore pinned optional speech model
        run: node tools/fetch-speech-model.mjs
      - name: Build unsigned macOS application
        run: npm run dist > reports/ci-build.log 2>&1
      - name: Packaged host integration
        env:
          VEK_DATA_DIR: ${{ github.workspace }}/data/ci-workbench
          VEK_WORKBENCH_CLI: ${{ github.workspace }}/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app/cli/wiek-browser.mjs
        run: node tests/workbench-integration.mjs > reports/ci-workbench.log 2>&1
      - name: Packaged native local services panel
        env:
          WIEK_TEST_APP_ROOT: ${{ github.workspace }}/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app
        run: node --test tests/local-server-panel.test.mjs > reports/ci-local-server-panel.log 2>&1
      - name: Packaged migration and MCP panels
        env:
          VEK_STORAGE_APP_ROOT: ${{ github.workspace }}/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app
          WIEK_INDEXEDDB_APP_ROOT: ${{ github.workspace }}/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app
          WIEK_MCP_APP_ROOT: ${{ github.workspace }}/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app
          VEK_MCP_APP_ROOT: ${{ github.workspace }}/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app
        run: node --test --test-concurrency=1 tests/profile-web-storage.test.mjs tests/profile-indexeddb.test.mjs tests/mcp-prompts-panel.test.mjs tests/mcp-input-panel.test.mjs tests/mcp-modern-panel.test.mjs > reports/ci-migration-mcp-panels.log 2>&1
      - name: Packaged interface language
        env:
          WIEK_LANGUAGE_APP_ROOT: ${{ github.workspace }}/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app
        run: node --test tests/interface-language.test.mjs > reports/ci-interface-language.log 2>&1
      - name: Packaged browser continuation
        env:
          WIEK_RECOVERY_CLI: ${{ github.workspace }}/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app/cli/wiek-browser.mjs
        run: node --test tests/browser-recovery.test.mjs > reports/ci-browser-continuation.log 2>&1
      - name: Packaged scheduler runtime
        run: node tests/scheduler-packaged-runtime.mjs "$PWD/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app" "$PWD/dist/mac-arm64/Wiek Browser.app/Contents/MacOS/Wiek Browser" > reports/ci-scheduler-runtime.log 2>&1
      - name: Shared SDK browser suite on Wiek
        env:
          VEK_DATA_DIR: ${{ github.workspace }}/data/ci-sdk
          WIEK_COMPARISON_CLI: ${{ github.workspace }}/dist/mac-arm64/Wiek Browser.app/Contents/Resources/app/cli/wiek-browser.mjs
        run: node tests/run-comparison.mjs --browser wiek > reports/ci-browser-suite.log 2>&1
      - name: Verify package and pinned upstream inputs
        run: |
          node tools/verify-independent-runtime.mjs "dist/mac-arm64/Wiek Browser.app/Contents/Resources/app" > reports/ci-independent-runtime.log 2>&1
          node tools/verify-public-copy.mjs > reports/ci-public-copy.log 2>&1
          node tools/verify-release.mjs > reports/ci-package-identity.log 2>&1
          node tools/verify-brand-assets.mjs "dist/mac-arm64/Wiek Browser.app/Contents/Resources/app" > reports/ci-brand-identity.log 2>&1
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wiek-validation-${{ github.sha }}
          retention-days: 7
          path: |
            reports/ci-*.log
            reports/wiek-e2e*.json
            reports/wiek-e2e*.log
            reports/package-source-verification.json
            reports/package-content-audit.json
            reports/upstream-test-integrity.json
