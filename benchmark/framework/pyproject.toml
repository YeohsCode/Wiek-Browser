[project]
name = "wiek-browser-benchmark-framework"
version = "0.1.0b1"
description = "Reproducible benchmark harness for comparing model browser-task performance under controlled agent and browser-tool settings."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "loguru>=0.7.2",
    "openai-codex>=0.1.0b2",
    "pillow>=10.4.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "tiktoken>=0.13.0",
    "tqdm>=4.66.5",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.21",
]
