<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"><title>Vek Browser</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="agent-panel.css"><link rel="stylesheet" href="workspace-panel.css"><link rel="stylesheet" href="mcp-panel.css"><link rel="stylesheet" href="tools-panel.css"><link rel="stylesheet" href="preferences-panel.css"><link rel="stylesheet" href="library-panel.css"><link rel="stylesheet" href="recorder-panel.css"><link rel="stylesheet" href="desktop-panel.css"><link rel="stylesheet" href="scheduler-panel.css"></head><body>
<aside><div class="brand"><span class="logo">v</span><div>vek<span class="brand-sub">Your space on the web</span></div></div><div class="rail-label">SPACES<button id="manage-spaces" title="Manage Spaces">⋯</button><button id="new-space" title="New space">＋</button></div><nav id="spaces"></nav><div class="rail-bottom"><button data-panel="agents">✧ <span>Agents & automations</span></button><button data-panel="library">▧ <span>Library & screenshots</span></button><button data-panel="recorder">◎ <span>Action recordings</span></button><button data-panel="workspace">▤ <span>Workspace & Git</span></button><button data-panel="mcp">⌘ <span>MCP integrations</span></button><button data-panel="catalog">◇ <span>Skills & commands</span></button><button data-panel="voice">◉ <span>Voice input</span></button><button data-panel="bookmarks">☆ <span>Bookmarks</span></button><button data-panel="history">◷ <span>History</span></button><button data-panel="downloads">↓ <span>Downloads</span><span id="download-count"></span></button><button data-panel="settings">⚙ <span>Settings</span></button><div class="local-label"><i></i> Local browser · <span id="version"></span></div></div></aside>
<header><div class="tabbar"><div id="tabs"></div><button id="new-tab" title="New tab">＋</button><div class="window-label">VEK BROWSER</div></div><div class="toolbar"><button id="back" title="Back">←</button><button id="forward" title="Forward">→</button><button id="reload" title="Reload">↻</button><form id="address-form"><span class="address-icon">⌕</span><input id="address" aria-label="Address or search" placeholder="Search or enter a URL" autocomplete="off" spellcheck="false"><button type="button" id="bookmark" title="Bookmark page">☆</button></form><button id="ownership">Your space</button><button id="menu" title="Space actions">⋯</button></div></header>
<main id="panel"><div id="empty"><div class="welcome-icon">v</div><h1>A little room to explore.</h1><p>Open a page, start a task, or create a space for your next idea.</p><form id="welcome-form"><input id="welcome-search" placeholder="Search the web or enter a URL"><button>Go →</button></form><div id="home-pins"></div><button id="add-home-pin">＋ Add website shortcut</button><div class="welcome-note">Your sessions and browsing data stay on this device.</div></div><section id="panel-content" hidden></section></main>
<div id="space-modal" class="modal" hidden><form id="space-form" class="dialog"><div class="dialog-eyebrow">MAKE ROOM</div><h2>Create a space</h2><p>Keep tabs organized around what you’re doing.</p><label>Name<input id="space-name" required placeholder="Research, weekend plans, work…" maxlength="100"></label><label>Profile<select id="space-profile"></select></label><div class="dialog-actions"><button type="button" id="cancel-space">Cancel</button><button class="primary">Create space</button></div></form></div>
<div id="space-menu" class="popover" hidden><button id="rename-space">Rename space</button><button id="finish-task">Finish agent task</button><button id="close-space" class="danger">Close space</button></div><form id="findbar" hidden><input id="findtext" placeholder="Find in page" aria-label="Find in page"><span id="find-count"></span><button type="button" id="find-prev" title="Previous match">↑</button><button type="button" id="find-next" title="Next match">↓</button><button type="button" id="find-close" title="Close find">×</button></form><div id="toast" hidden></div><div id="highlight" hidden></div>
<script src="agent-panel.js"></script><script src="workspace-panel.js"></script><script src="mcp-panel.js"></script><script src="tools-panel.js"></script><script src="preferences-panel.js"></script><script src="library-panel.js"></script><script src="recorder-panel.js"></script><script src="desktop-panel.js"></script><script src="scheduler-panel.js"></script><script src="renderer.js"></script></body></html>
