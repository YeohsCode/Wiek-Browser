<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"><title data-i18n>Wiek Browser</title><link rel="icon" href="assets/wiek.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="agent-panel.css"><link rel="stylesheet" href="workspace-panel.css"><link rel="stylesheet" href="mcp-panel.css"><link rel="stylesheet" href="tools-panel.css"><link rel="stylesheet" href="preferences-panel.css"><link rel="stylesheet" href="library-panel.css"><link rel="stylesheet" href="recorder-panel.css"><link rel="stylesheet" href="desktop-panel.css"><link rel="stylesheet" href="scheduler-panel.css"></head><body>
<aside><div class="brand"><img class="logo" src="assets/wiek.svg" alt="Wiek"><div>wiek<span class="brand-sub" data-i18n>Your browser, your tabs</span></div></div><div class="rail-label"><span data-i18n>TAB GROUPS</span><button id="manage-spaces" title="Manage tab groups" data-i18n-attrs="title">⋯</button><button id="new-space" title="New tab group" data-i18n-attrs="title">＋</button></div><nav id="spaces"></nav><div class="rail-bottom"><button data-panel="agents">✧ <span data-i18n>Agents & automations</span></button><button data-panel="library">▧ <span data-i18n>Saved items & screenshots</span></button><button data-panel="workspace">▤ <span data-i18n>Project files & Git</span></button><button data-panel="bookmarks">☆ <span data-i18n>Bookmarks</span></button><button data-panel="downloads">↓ <span data-i18n>Downloads</span><span id="download-count"></span></button><details id="browser-tools"><summary><span data-i18n>Browser tools</span></summary><button data-panel="recorder">◎ <span data-i18n>Page action history</span></button><button data-panel="mcp">⌘ <span data-i18n>External tools (MCP)</span></button><button data-panel="catalog">◇ <span data-i18n>Agent skills & shortcuts</span></button><button data-panel="translation">文 <span data-i18n>Translation</span></button><button data-panel="voice">◉ <span data-i18n>Voice input</span></button><button data-panel="history">◷ <span data-i18n>History</span></button></details><button data-panel="settings">⚙ <span data-i18n>Settings</span></button><div class="local-label"><i></i><span data-i18n>Local browser</span> · <span id="version"></span></div></div></aside>
<header><div class="tabbar"><div id="tabs"></div><button id="new-tab" title="New tab" data-i18n-attrs="title">＋</button><div class="window-label" data-i18n>WIEK BROWSER</div></div><div class="toolbar"><button id="back" title="Back" data-i18n-attrs="title">←</button><button id="forward" title="Forward" data-i18n-attrs="title">→</button><button id="reload" title="Reload" data-i18n-attrs="title">↻</button><form id="address-form"><span class="address-icon">⌕</span><input id="address" aria-label="Address or search" placeholder="Search or enter a URL" autocomplete="off" spellcheck="false" data-i18n-attrs="aria-label placeholder"><button type="button" id="bookmark" title="Bookmark page" data-i18n-attrs="title">☆</button></form><button id="ownership">Your tab group</button><button id="menu" title="Tab group actions" data-i18n-attrs="title">⋯</button></div></header>
<main id="panel"><div id="empty"><img class="welcome-icon" src="assets/wiek.svg" alt="Wiek"><h1 data-i18n>New tab</h1><p data-i18n>Open a page, start a task, or create a tab group.</p><form id="welcome-form"><input id="welcome-search" placeholder="Search the web or enter a URL" data-i18n-attrs="placeholder"><button data-i18n>Go →</button></form><div id="home-pins"></div><button id="add-home-pin" data-i18n>＋ Add website shortcut</button><div class="welcome-note" data-i18n>Your sessions and browsing data stay on this device.</div></div><section id="panel-content" hidden></section></main>
<div id="space-modal" class="modal" hidden><form id="space-form" class="dialog"><h2 data-i18n>Create a tab group</h2><p data-i18n>Keep tabs organized around what you’re doing.</p><label><span data-i18n>Name</span><input id="space-name" required placeholder="Research, weekend plans, work…" maxlength="100" data-i18n-attrs="placeholder"></label><label><span data-i18n>Browser profile</span><select id="space-profile"></select></label><div class="dialog-actions"><button type="button" id="cancel-space" data-i18n>Cancel</button><button class="primary" data-i18n>Create tab group</button></div></form></div>
<div id="space-menu" class="popover" hidden><button id="rename-space" data-i18n>Rename tab group</button><button id="finish-task" data-i18n>Finish agent task</button><button id="close-space" class="danger" data-i18n>Close tab group</button></div><form id="findbar" hidden><input id="findtext" placeholder="Find in page" aria-label="Find in page" data-i18n-attrs="placeholder aria-label"><span id="find-count"></span><button type="button" id="find-prev" title="Previous match" data-i18n-attrs="title">↑</button><button type="button" id="find-next" title="Next match" data-i18n-attrs="title">↓</button><button type="button" id="find-close" title="Close find" data-i18n-attrs="title">×</button></form><div id="toast" hidden></div><div id="highlight" hidden></div>
<script src="locales/i18n-zh.js"></script><script src="locales/i18n.js"></script><script src="agent-panel.js"></script><script src="workspace-panel.js"></script><script src="mcp-panel.js"></script><script src="tools-panel.js"></script><script src="preferences-panel.js"></script><script src="library-panel.js"></script><script src="recorder-panel.js"></script><script src="desktop-panel.js"></script><script src="scheduler-panel.js"></script><script src="translation-panel.js"></script><script src="renderer.js"></script></body></html>
